name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (freezed/json_serializable)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify formatting
        # Generated .g.dart/.freezed.dart files are reformatted by build_runner
        # itself at its own (unconfigurable) line length, unrelated to this
        # project's 120-char convention for hand-written code - excluded here
        # via pathspec rather than checked, since they'd never match either way.
        run: |
          dart format --line-length=120 lib test
          git diff --exit-code -- lib test ':!**/*.g.dart' ':!**/*.freezed.dart'

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  # Runs on every push to main - uploads build artifacts for quick access
  # during development. These are NOT permanent download links: they sit
  # behind a GitHub login, expire after 90 days, and download as a zip. For
  # a real shareable download link, push a version tag instead (see the
  # `release` job below).
  build:
    name: Build (${{ matrix.target }})
    needs: test
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: apk
            command: build apk --release
            output: build/app/outputs/flutter-apk/app-release.apk
          - target: appbundle
            command: build appbundle --release
            output: build/app/outputs/bundle/release/app-release.aab
          - target: web
            command: build web --release
            output: build/web
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (freezed/json_serializable)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Enable web
        if: matrix.target == 'web'
        run: flutter config --enable-web

      - name: Build
        run: flutter ${{ matrix.command }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dhan-sanket-${{ matrix.target }}
          path: ${{ matrix.output }}
          if-no-files-found: error

  # Runs only when a version tag (e.g. v1.0.0) is pushed. Publishes a GitHub
  # Release with the APK/AAB/web-zip attached as assets - these get
  # permanent, public, direct download URLs of the form:
  #   https://github.com/<owner>/<repo>/releases/download/<tag>/<file>
  # No login required to download, no expiry.
  release:
    name: Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (freezed/json_serializable)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK
        run: flutter build apk --release

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Build Web
        run: |
          flutter config --enable-web
          flutter build web --release

      - name: Rename outputs and zip web build
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk release/dhan-sanket-${{ github.ref_name }}.apk
          cp build/app/outputs/bundle/release/app-release.aab release/dhan-sanket-${{ github.ref_name }}.aab
          (cd build/web && zip -r ../../release/dhan-sanket-${{ github.ref_name }}-web.zip .)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
